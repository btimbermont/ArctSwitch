name: Release

# Run manually from the Actions tab: Release -> Run workflow, then enter a version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates tag v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Version must look like 1.2.3 or 1.2.3-beta.1, got '$env:VERSION'"
          }
          if (git ls-remote --tags origin "refs/tags/v$env:VERSION") {
            throw "Tag v$env:VERSION already exists"
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish ArctSwitch/ArctSwitch.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          "-p:Version=$env:VERSION" -o publish

      - name: Create GitHub release
        run: |
          $flags = @('--generate-notes', '--target', $env:GITHUB_SHA, '--title', "ArctSwitch $env:VERSION")
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" publish/ArctSwitch.exe @flags
