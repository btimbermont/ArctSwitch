name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish ArctSwitch/ArctSwitch.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ArctSwitch-${{ github.sha }}
          path: publish/ArctSwitch.exe
          retention-days: 14
